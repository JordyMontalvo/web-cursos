<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - IATIBET ZUREON</title>
    <meta name="description" content="Establece una nueva contraseña para tu cuenta">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function () {
            const name = localStorage.getItem('branding_companyName');
            const logo = localStorage.getItem('branding_logoUrl');
            if (name || logo) {
                const style = document.createElement('style');
                style.id = 'early-branding-style';
                let css = '';
                if (name) {
                    css += `.logo-text, .logo-text-sm, .auth-logo-text { visibility: hidden; position: relative; } `;
                    css += `.logo-text::after, .logo-text-sm::after, .auth-logo-text::after { content: "${name}"; visibility: visible; position: absolute; left: 0; top: 0; width: 100%; height: 100%; } `;
                }
                if (logo) {
                    css += `.logo-icon, .logo-icon-sm, .auth-logo-icon { background-image: url("${logo}") !important; background-size: cover !important; background-position: center !important; border: none !important; color: transparent !important; }`;
                }
                style.innerHTML = css;
                document.head.appendChild(style);
            }
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0A0A0F;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .auth-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .auth-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(124, 58, 237, 0.15) 0%, transparent 50%);
            animation: rotateBG 20s linear infinite;
        }

        @keyframes rotateBG {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .auth-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #7C3AED, #EC4899);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.25rem;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .auth-title {
            color: #fff;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .auth-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #7C3AED;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }

        /* Password Wrapper for Eye Icon */
        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #7C3AED, #EC4899);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }

        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10B981;
        }

        .alert.hidden {
            display: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .auth-footer a {
            color: #7C3AED;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        #tokenMissingMsg {
            text-align: center;
            color: #EF4444;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 1rem;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="auth-bg"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <div class="auth-logo-icon">I</div>
                    <span class="auth-title auth-logo-text" style="font-size: 1.5rem">IATIBET</span>
                </a>
                <h1 class="auth-title">Nueva Contraseña</h1>
                <p class="auth-subtitle">Ingresa tu nueva contraseña para acceder a tu cuenta.</p>
            </div>

            <div id="tokenMissingMsg">
                El enlace de recuperación no es válido o está incompleto. Asegúrate de copiar el enlace completo desde tu correo.
            </div>

            <div class="alert hidden" id="resetAlert">
                <span id="resetAlertMsg"></span>
            </div>

            <form id="resetForm" novalidate style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="newPassword">Nueva contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="2" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="2" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="resetBtn">
                    Restablecer Contraseña
                </button>
            </form>

            <div class="auth-footer">
                <a href="/login.html">Volver a iniciar sesión</a>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('tokenMissingMsg').style.display = 'block';
        } else {
            document.getElementById('resetForm').style.display = 'block';
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const isText = input.type === 'text';
            input.type = isText ? 'password' : 'text';
            btn.innerHTML = isText
                ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>'
                : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M17.94 17.94C16.23 19.24 14.19 20 12 20C5 20 1 12 1 12C2.24 9.68 4.02 7.72 6.06 6.39M9.9 4.24C10.59 4.09 11.29 4 12 4C19 4 23 12 23 12C22.44 13.12 21.73 14.17 20.89 15.09M1 1L23 23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
        }

        function showAlert(msg, type = 'error') {
            const alert = document.getElementById('resetAlert');
            alert.className = `alert ${type}`;
            document.getElementById('resetAlertMsg').innerHTML = msg;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const alert = document.getElementById('resetAlert');
            alert.className = 'alert hidden';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showAlert('La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('Las contraseñas no coinciden.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Procesando...';

            try {
                await configReady;
                const res = await fetch(apiUrl('/api/auth/reset-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (data.success) {
                    showAlert('¡Contraseña actualizada exitosamente! Redirigiendo al login...', 'success');
                    document.getElementById('resetForm').reset();
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Error al restablecer la contraseña.');
                    btn.disabled = false;
                    btn.innerHTML = 'Restablecer Contraseña';
                }
            } catch (err) {
                showAlert('Error de conexión. Intenta de nuevo.');
                btn.disabled = false;
                btn.innerHTML = 'Restablecer Contraseña';
            }
        });
    </script>
</body>

</html>
