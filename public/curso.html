<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - IATIBET ZUREON</title>
    <meta name="description" content="Aprende con nuestros cursos online">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .course-player { padding: 2rem 0; }
        .player-wrapper { display: flex; flex-direction: column; gap: 1rem; }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #0f0f1a;
            border-radius: 16px;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .video-placeholder {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1rem;
            color: rgba(255,255,255,0.5);
        }
        .course-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
        }
        .course-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .course-meta { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .meta-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.875rem; opacity: 0.7; }
        .course-navigation { display: flex; gap: 0.75rem; }

        /* Chapters sidebar layout */
        .course-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 2rem;
            align-items: start;
        }
        @media (max-width: 900px) {
            .course-layout { grid-template-columns: 1fr; }
        }

        /* Chapter/Episode list */
        .chapters-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
        }
        .chapters-panel-header {
            padding: 1rem 1.25rem;
            font-weight: 700;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }
        .chapter-group { border-bottom: 1px solid rgba(255,255,255,0.07); }
        .chapter-group-title {
            padding: 0.875rem 1.25rem;
            font-weight: 700;
            font-size: 0.875rem;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .episode-item {
            padding: 0.75rem 1.25rem 0.75rem 2rem;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .episode-item:hover { background: rgba(255,255,255,0.07); }
        .episode-item.active { background: rgba(124,58,237,0.2); color: #C4B5FD; }
        .episode-num {
            width: 24px; height: 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700;
            flex-shrink: 0;
        }
        .episode-item.active .episode-num { background: #7C3AED; color: white; }
        .episode-duration { margin-left: auto; opacity: 0.5; font-size: 0.75rem; }

        /* Loading */
        .loading-state {
            display: flex; align-items: center; justify-content: center;
            min-height: 300px; flex-direction: column; gap: 1rem;
            color: rgba(255,255,255,0.5);
        }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #7C3AED; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<style>
    /* Membership Lock Screen */
    .lock-screen {
        position: fixed;
        inset: 0;
        background: rgba(10,10,15,0.96);
        backdrop-filter: blur(12px);
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }
    .lock-screen.hidden { display: none; }
    .lock-card {
        background: rgba(20,20,35,0.9);
        border: 1px solid rgba(124,58,237,0.3);
        border-radius: 28px;
        padding: 3rem 2.5rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 80px rgba(124,58,237,0.08);
    }
    .lock-card-icon {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(79,255,176,0.1));
        border: 1px solid rgba(124,58,237,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        margin: 0 auto 1.75rem;
    }
    .lock-card h2 {
        font-size: 1.75rem;
        font-weight: 800;
        color: #fff;
        margin-bottom: 0.75rem;
    }
    .lock-card p {
        color: rgba(255,255,255,0.55);
        line-height: 1.7;
        margin-bottom: 2rem;
        font-size: 0.95rem;
    }
    .lock-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 2rem;
        background: linear-gradient(135deg, #7C3AED, #5B21B6);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.25s;
        margin-bottom: 1rem;
        width: 100%;
        justify-content: center;
    }
    .lock-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(124,58,237,0.4); }
    .lock-btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 2rem;
        background: transparent;
        color: rgba(255,255,255,0.5);
        font-size: 0.9rem;
        font-weight: 500;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.1);
        cursor: pointer;
        text-decoration: none;
        transition: all 0.25s;
        width: 100%;
    }
    .lock-btn-outline:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
    /* User badge header */
    .user-badge {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 100px;
        padding: 0.4rem 1rem 0.4rem 0.5rem;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
    }
    .user-badge:hover { background: rgba(255,255,255,0.1); }
    .user-avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7C3AED, #4FFFB0);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
        color: #fff;
    }
    .user-name { font-size: 0.875rem; font-weight: 500; color: #fff; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .membership-tag {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.2rem 0.5rem;
        border-radius: 100px;
        background: rgba(124,58,237,0.2);
        color: #A78BFA;
        letter-spacing: 0.04em;
    }
    .membership-tag.active { background: rgba(79,255,176,0.1); color: #4FFFB0; }
    .user-dropdown {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        background: #18182A;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        padding: 0.5rem;
        min-width: 180px;
        display: none;
        z-index: 200;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .dropdown-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 0.875rem;
        border-radius: 10px;
        font-size: 0.875rem;
        color: rgba(255,255,255,0.7);
        cursor: pointer;
        transition: all 0.15s;
        text-decoration: none;
    }
    .dropdown-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .dropdown-item.danger { color: #FF6B70; }
    .dropdown-item.danger:hover { background: rgba(255,75,85,0.1); }
    .dropdown-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 0.25rem 0; }
</style>
<body>
    <!-- Membership Lock Screen -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-card">
            <div class="lock-card-icon">🔒</div>
            <h2>Contenido Exclusivo</h2>
            <p>Este curso está disponible solo para miembros activos. Elige un plan y accede a todos los cursos de la plataforma.</p>
            <a href="#" class="lock-btn" id="lockMembershipBtn">
                💎 Ver planes de membresía
            </a>
            <a href="/" class="lock-btn-outline">← Volver al inicio</a>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <span class="logo-text">LOGO</span>
                </div>
                <nav class="nav">
                    <a href="/" class="nav-link">Cursos</a>
                </nav>
                <div class="header-search">
                    <input type="search" placeholder="Búsqueda..." class="search-input">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M9 17C13.4183 17 17 13.4183 17 9C17 4.58172 13.4183 1 9 1C4.58172 1 1 4.58172 1 9C1 13.4183 4.58172 17 9 17Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M19 19L14.65 14.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <button class="menu-btn"><span></span><span></span><span></span></button>
                <div class="header-actions" id="headerActions">
                    <a href="/login" class="btn-link">Entrar</a>
                    <a href="/register" class="btn-primary">Crear Cuenta</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Course Player -->
    <section class="course-player">
        <div class="container">
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <span>Cargando curso...</span>
            </div>

            <div id="courseContent" style="display:none;">
                <div class="course-layout">
                    <!-- Left: Video + Info -->
                    <div>
                        <div class="video-container" id="videoContainer">
                            <div class="video-placeholder">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                <span>Selecciona un episodio</span>
                            </div>
                        </div>

                        <div class="course-info" style="margin-top:1rem;">
                            <div class="course-details">
                                <h1 class="course-title" id="courseTitle">-</h1>
                                <div class="course-meta">
                                    <span class="meta-item">
                                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="2"/><path d="M8 4V8L11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                                        <span id="episodeCount">-</span>
                                    </span>
                                    <span class="meta-item">
                                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" rx="1" stroke="currentColor" stroke-width="2"/><path d="M2 6H14" stroke="currentColor" stroke-width="2"/></svg>
                                        <span id="chapterCount">-</span>
                                    </span>
                                </div>
                                <p id="nowPlaying" style="margin-top:0.5rem; font-size:0.85rem; opacity:0.6;"></p>
                            </div>
                            <div class="course-navigation">
                                <button class="btn-nav btn-prev" id="btnPrev" onclick="prevEpisode()">
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 16L6 10L12 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    ATRÁS
                                </button>
                                <button class="btn-nav btn-next" id="btnNext" onclick="nextEpisode()">
                                    SIGUIENTE
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 4L14 10L8 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Chapters + Episodes -->
                    <div class="chapters-panel">
                        <div class="chapters-panel-header">Contenido del Curso</div>
                        <div id="chaptersList"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="/config.js"></script>
    <script>
    let course = null;
    let allEpisodes = [];
    let currentEpisodeIndex = 0;

    // ── Auth Header ──────────────────────────────────────────────────────────
    function updateHeader() {
        const user = JSON.parse(localStorage.getItem('authUser') || 'null');
        const actionsEl = document.getElementById('headerActions');
        if (user) {
            const initials = user.name ? user.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2) : '?';
            const hasMem = user.hasMembership;
            actionsEl.innerHTML = `
                <div class="user-badge" id="dropdownBadge">
                    <div class="user-avatar">${initials}</div>
                    <span class="user-name">${user.name}</span>
                    <span class="membership-tag ${hasMem ? 'active' : ''}">${hasMem ? user.membershipPlan || 'Pro' : 'Sin plan'}</span>
                    <div class="user-dropdown" id="dropdownContent">
                        <a href="/" class="dropdown-item">🏠 Inicio</a>
                        <a href="/membresia" class="dropdown-item">💎 Membresía</a>
                        ${user.role === 'admin' ? '<a href="/admin" class="dropdown-item">⚙️ Admin</a>' : ''}
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item danger" onclick="logout()">🚪 Cerrar sesión</div>
                    </div>
                </div>`;
            setTimeout(() => {
                const badge = document.getElementById('dropdownBadge');
                const dd = document.getElementById('dropdownContent');
                if (badge && dd) {
                    badge.addEventListener('click', (e) => {
                        e.stopPropagation();
                        dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
                    });
                    dd.addEventListener('click', (e) => e.stopPropagation());
                    document.addEventListener('click', () => dd.style.display = 'none');
                }
            }, 0);
        }
    }
    function logout() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('authUser');
        window.location.href = '/login';
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
        updateHeader();
        const parts = window.location.pathname.split('/');
        const courseId = parts[parts.length - 1];

        if (!courseId) {
            document.getElementById('loadingState').innerHTML = '<p style="color:#f87171;">ID de curso no encontrado</p>';
            return;
        }

        await configReady;

        // Verificar autenticación y membresía
        const token = localStorage.getItem('authToken');
        if (!token) {
            window.location.href = `/login?redirect=/curso/${courseId}`;
            return;
        }

        try {
            // Verificar acceso
            const accessRes = await fetch(apiUrl('/api/auth/check-access'), {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const accessData = await accessRes.json();

            if (!accessData.success || !accessData.hasAccess) {
                // Sin membresía: mostrar pantalla de bloqueo
                const lockScreen = document.getElementById('lockScreen');
                lockScreen.classList.remove('hidden');
                // Cargar el curso de fondo pero sin mostrar contenido
                const courseRes = await fetch(apiUrl(`/api/courses/${courseId}`));
                const courseData = await courseRes.json();
                const courseName = courseData.success ? encodeURIComponent(courseData.course.name) : '';
                document.getElementById('lockMembershipBtn').href = `/membresia?from=${courseId}&course=${courseName}`;
                document.getElementById('loadingState').style.display = 'none';
                return;
            }

            // Actualizar user en localStorage con datos frescos
            if (accessData.hasMembership !== undefined) {
                const user = JSON.parse(localStorage.getItem('authUser') || '{}');
                user.hasMembership = accessData.hasMembership;
                user.membershipPlan = accessData.membershipPlan;
                localStorage.setItem('authUser', JSON.stringify(user));
            }

            // Cargar el curso
            const res = await fetch(apiUrl(`/api/courses/${courseId}`));
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.message);

            course = data.course;
            document.getElementById('lockScreen').classList.add('hidden');
            initCourse();
        } catch (err) {
            document.getElementById('loadingState').innerHTML = `<p style="color:#f87171;">Error al cargar el curso: ${err.message}</p>`;
        }
    });

    // ── Setup course ──────────────────────────────────────────────────────────
    function initCourse() {
        document.title = `${course.name} - IATIBET ZUREON`;
        document.getElementById('courseTitle').textContent = course.name;
        document.getElementById('episodeCount').textContent = `${course.totalEpisodes || 0} Episodios`;
        document.getElementById('chapterCount').textContent = `${course.totalChapters || 0} Capítulos`;

        // Build flat episode list
        allEpisodes = [];
        (course.chapters || []).forEach((ch, ci) => {
            (ch.episodes || []).forEach((ep, ei) => {
                allEpisodes.push({ chapterIndex: ci, episodeIndex: ei, chapter: ch, episode: ep });
            });
        });

        renderChaptersList();

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('courseContent').style.display = 'block';

        // Auto-play first episode
        if (allEpisodes.length > 0) {
            playEpisode(0);
        }
    }

    // ── Render sidebar ────────────────────────────────────────────────────────
    function renderChaptersList() {
        const container = document.getElementById('chaptersList');
        if (!course.chapters || course.chapters.length === 0) {
            container.innerHTML = '<p style="padding:1.5rem; opacity:0.5; font-size:0.875rem; text-align:center;">Sin contenido aún</p>';
            return;
        }

        let flatIndex = 0;
        container.innerHTML = course.chapters.map((ch, ci) => {
            const episodes = (ch.episodes || []).map((ep, ei) => {
                const idx = flatIndex++;
                return `
                    <div class="episode-item" id="ep-item-${idx}" onclick="playEpisode(${idx})">
                        <div class="episode-num">${ei + 1}</div>
                        <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${ep.title}</span>
                        ${ep.duration ? `<span class="episode-duration">${ep.duration}</span>` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="chapter-group">
                    <div class="chapter-group-title">
                        <span>Cap. ${ci + 1}: ${ch.title}</span>
                        <span style="opacity:0.5; font-size:0.75rem;">${(ch.episodes||[]).length} ep.</span>
                    </div>
                    ${episodes || '<div style="padding:0.75rem 1.25rem 0.75rem 2rem; opacity:0.4; font-size:0.8rem;">Sin episodios</div>'}
                </div>
            `;
        }).join('');
    }

    // ── Play episode ──────────────────────────────────────────────────────────
    function playEpisode(index) {
        if (index < 0 || index >= allEpisodes.length) return;
        currentEpisodeIndex = index;

        const { episode, chapter, chapterIndex, episodeIndex } = allEpisodes[index];

        // Update video
        const container = document.getElementById('videoContainer');
        const videoUrl = episode.videoUrl || '';

        // Convert YouTube watch URL to embed if needed
        const embedUrl = toEmbedUrl(videoUrl);

        if (embedUrl) {
            container.innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
        } else {
            container.innerHTML = `
                <div class="video-placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>URL de video no válida</span>
                    <small style="opacity:0.5;">${videoUrl}</small>
                </div>`;
        }

        // Update now playing
        document.getElementById('nowPlaying').textContent = `▶ ${chapter.title} · ${episode.title}`;

        // Update active state in sidebar
        document.querySelectorAll('.episode-item').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById(`ep-item-${index}`);
        if (activeEl) {
            activeEl.classList.add('active');
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function toEmbedUrl(url) {
        if (!url) return null;
        // Already embed
        if (url.includes('youtube.com/embed/') || url.includes('player.vimeo.com')) return url;
        // YouTube watch
        const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}`;
        // Direct video URL
        if (url.match(/\.(mp4|webm|ogg)$/i)) return url;
        return url; // try as-is
    }

    function prevEpisode() { playEpisode(currentEpisodeIndex - 1); }
    function nextEpisode() { playEpisode(currentEpisodeIndex + 1); }
    </script>
</body>
</html>
