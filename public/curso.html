<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - IATIBET ZUREON</title>
    <meta name="description" content="Aprende con nuestros cursos online">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #130a21; /* Dark purple base */ color: #fff; }
        .course-player { padding: 2rem 0; }
        @media (max-width: 900px) {
            .course-player { padding: 0 0 2rem 0; }
            .header { display: none !important; } /* Hide standard header on mobile */
        }
        
        .mobile-header {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(19,10,33,1) 0%, rgba(19,10,33,0) 100%);
        }
        @media (max-width: 900px) {
            .mobile-header { display: flex; }
            .course-player .container { padding: 0; max-width: 100%; }
        }
        .mobile-header .back-btn { color: #A78BFA; text-decoration: none; display: flex; align-items: center; }
        .mobile-header .logo-text { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.05em; color: #fff; text-transform: uppercase; }

        .player-wrapper { display: flex; flex-direction: column; gap: 1rem; }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        @media (max-width: 900px) {
            .video-container { border-radius: 0; }
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .video-placeholder {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1rem;
            color: rgba(255,255,255,0.5);
        }
        
        .course-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 0.5rem 1.5rem 1.5rem;
        }
        @media (min-width: 901px) {
            .course-info {
                flex-direction: row; align-items: center; justify-content: space-between;
                background: rgba(255,255,255,0.05); border-radius: 12px; padding: 1.5rem;
            }
        }
        
        .course-title { font-size: 1.65rem; font-weight: 800; margin-bottom: 0.5rem; line-height: 1.2; }
        .course-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; opacity: 0.6; font-size: 0.9rem; font-weight: 500; }
        .course-meta span.separator { margin: 0 0.5rem; }
        
        .course-navigation {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
        }
        @media (min-width: 901px) {
            .course-navigation { display: flex; width: auto; }
        }
        .btn-nav {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.85rem 1rem; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
            color: #fff; cursor: pointer; border: none; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-prev { background: rgba(124,58,237,0.7); }
        .btn-prev:hover:not(:disabled) { background: rgba(124,58,237,0.9); }
        .btn-next { background: #15803D; } /* Dark Green */
        .btn-next:hover:not(:disabled) { background: #16A34A; }

        /* Chapters sidebar layout */
        .course-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 2rem;
            align-items: start;
        }
        @media (max-width: 900px) {
            .course-layout { grid-template-columns: 1fr; gap: 0; }
            .chapters-panel { padding: 0 1.5rem; }
        }

        /* Chapter/Episode list */
        .chapters-panel {
            border-radius: 16px;
        }
        .chapter-group-title {
            padding: 1rem 0 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .chapter-group-title span.ep-count { opacity: 0.6; font-size: 0.85rem; font-weight: 500; }
        
        .episode-item {
            padding: 0.75rem 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        .episode-item:last-child { border-bottom: none; }
        
        /* Thumbnail inside Episode */
        .episode-thumb {
            width: 120px;
            height: 68px;
            border-radius: 8px;
            background-color: #2D1B4E;
            background-size: cover;
            background-position: center;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }
        .episode-thumb-overlay {
            position: absolute; bottom: 4px; right: 4px;
            background: rgba(0,0,0,0.7); color: #fff; padding: 0.15rem 0.35rem;
            font-size: 0.65rem; font-weight: 700; border-radius: 4px;
        }
        
        .episode-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-center;
            min-width: 0;
        }
        .episode-title {
            font-size: 0.95rem; font-weight: 600; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 0.35rem;
        }
        .episode-duration-icon {
            display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: rgba(255,255,255,0.5);
        }
        .episode-duration-icon svg { width: 14px; height: 14px; opacity: 0.7; color: #A78BFA; }
        
        .episode-check {
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            color: #A78BFA; opacity: 0.3;
        }

        /* Active State */
        .episode-item.active { background: transparent; }
        .episode-item.active .episode-title { color: #fff; }
        .episode-item.active .episode-thumb {
            box-shadow: 0 0 0 2px #A78BFA, 0 0 15px rgba(167,139,250,0.5);
        }
        .episode-item.active .episode-thumb::after {
            content: ''; position: absolute; bottom: 0; left: 0; height: 3px; width: 60%; background: #A78BFA;
        }
        .episode-item.active .episode-check { color: #4FFFB0; opacity: 1; }
        .episode-item.active .episode-duration-icon { color: rgba(255,255,255,0.7); }

        /* Loading */
        .loading-state {
            display: flex; align-items: center; justify-content: center;
            min-height: 300px; flex-direction: column; gap: 1rem;
            color: rgba(255,255,255,0.5);
        }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #7C3AED; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<style>
    /* Membership Lock Screen */
    .lock-screen {
        position: fixed;
        inset: 0;
        background: rgba(10,10,15,0.96);
        backdrop-filter: blur(12px);
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }
    .lock-screen.hidden { display: none; }
    .lock-card {
        background: rgba(20,20,35,0.9);
        border: 1px solid rgba(124,58,237,0.3);
        border-radius: 28px;
        padding: 3rem 2.5rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 80px rgba(124,58,237,0.08);
    }
    .lock-card-icon {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(79,255,176,0.1));
        border: 1px solid rgba(124,58,237,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        margin: 0 auto 1.75rem;
    }
    .lock-card h2 {
        font-size: 1.75rem;
        font-weight: 800;
        color: #fff;
        margin-bottom: 0.75rem;
    }
    .lock-card p {
        color: rgba(255,255,255,0.55);
        line-height: 1.7;
        margin-bottom: 2rem;
        font-size: 0.95rem;
    }
    .lock-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 2rem;
        background: linear-gradient(135deg, #7C3AED, #5B21B6);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.25s;
        margin-bottom: 1rem;
        width: 100%;
        justify-content: center;
    }
    .lock-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(124,58,237,0.4); }
    .lock-btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 2rem;
        background: transparent;
        color: rgba(255,255,255,0.5);
        font-size: 0.9rem;
        font-weight: 500;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.1);
        cursor: pointer;
        text-decoration: none;
        transition: all 0.25s;
        width: 100%;
    }
    .lock-btn-outline:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
</style>
<body>
    <!-- Membership Lock Screen -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-card">
            <div class="lock-card-icon">🔒</div>
            <h2>Contenido Exclusivo</h2>
            <p>Este curso está disponible solo para miembros activos. Elige un plan y accede a todos los cursos de la plataforma.</p>
            <a href="#" class="lock-btn" id="lockMembershipBtn">
                💎 Ver planes de membresía
            </a>
            <a href="/" class="lock-btn-outline">← Volver al inicio</a>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <span class="logo-text">LOGO</span>
                </div>
                <nav class="nav">
                    <a href="/" class="nav-link">Cursos</a>
                </nav>
                <div class="header-search">
                    <input type="search" placeholder="Búsqueda..." class="search-input">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M9 17C13.4183 17 17 13.4183 17 9C17 4.58172 13.4183 1 9 1C4.58172 1 1 4.58172 1 9C1 13.4183 4.58172 17 9 17Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M19 19L14.65 14.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <button class="menu-btn"><span></span><span></span><span></span></button>
                <div class="header-actions" id="headerActions">
                    <a href="/login" class="btn-link">Entrar</a>
                    <a href="/register" class="btn-primary">Crear Cuenta</a>
                </div>
            </div>
        </div>
    </header>

    <header class="mobile-header">
        <a href="/" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <span class="logo-text">IATIBET</span>
        <div style="width:24px;"></div>
    </header>

    <!-- Course Player -->
    <section class="course-player">
        <div class="container">
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <span>Cargando curso...</span>
            </div>

            <div id="courseContent" style="display:none;">
                <div class="course-layout">
                    <!-- Left: Video + Info -->
                    <div>
                        <div class="video-container" id="videoContainer">
                            <div class="video-placeholder">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                <span>Selecciona un episodio</span>
                            </div>
                        </div>

                        <div class="course-info">
                            <div class="course-details">
                                <h1 class="course-title" id="courseTitle">-</h1>
                                <div class="course-meta">
                                    <span id="episodeCount">-</span>
                                    <span class="separator">·</span>
                                    <span id="chapterCount">-</span>
                                </div>
                                <p id="nowPlaying" style="display:none;"></p>
                            </div>
                            <div class="course-navigation">
                                <button class="btn-nav btn-prev" id="btnPrev" onclick="prevEpisode()">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                                    ATRÁS
                                </button>
                                <button class="btn-nav btn-next" id="btnNext" onclick="nextEpisode()">
                                    SIGUIENTE
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Chapters + Episodes -->
                    <div class="chapters-panel">
                        <div id="chaptersList"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="/config.js"></script>
    <script>
    let course = null;
    let allEpisodes = [];
    let currentEpisodeIndex = 0;

    // ── Auth Header ──────────────────────────────────────────────────────────
    function updateHeader() {
        const user = JSON.parse(localStorage.getItem('authUser') || 'null');
        const actionsEl = document.getElementById('headerActions');
        if (user) {
            const initials = user.name ? user.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2) : '?';
            const hasMem = user.hasMembership;
            actionsEl.innerHTML = `
                <div class="user-badge" id="dropdownBadge">
                    <div class="user-avatar">${initials}</div>
                    <span class="user-name">${user.name}</span>
                    <span class="membership-tag ${hasMem ? 'active' : ''}">${hasMem ? user.membershipPlan || 'Pro' : 'Sin plan'}</span>
                    <div class="user-dropdown" id="dropdownContent">
                        <a href="/" class="dropdown-item">🏠 Inicio</a>
                        <a href="/membresia" class="dropdown-item">💎 Membresía</a>
                        <a href="/perfil" class="dropdown-item">👤 Perfil</a>
                        ${user.role === 'admin' ? '<a href="/admin" class="dropdown-item">⚙️ Admin</a>' : ''}
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item danger" onclick="logout()">🚪 Cerrar sesión</div>
                    </div>
                </div>`;
            setTimeout(() => {
                const badge = document.getElementById('dropdownBadge');
                const dd = document.getElementById('dropdownContent');
                if (badge && dd) {
                    badge.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const isVisible = dd.style.display === 'block';
                        // Close all other dropdowns if any, then toggle this one
                        dd.style.display = isVisible ? 'none' : 'block';
                    });
                    
                    // Prevent clicks inside the dropdown from closing it
                    dd.addEventListener('click', (e) => {
                        e.stopPropagation();
                    });

                    // Close when clicking anywhere else
                    document.addEventListener('click', () => {
                        dd.style.display = 'none';
                    });
                }
            }, 0);
        }
    }
    function logout() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('authUser');
        window.location.href = '/login';
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
        updateHeader();
        const parts = window.location.pathname.split('/');
        const courseId = parts[parts.length - 1];

        if (!courseId) {
            document.getElementById('loadingState').innerHTML = '<p style="color:#f87171;">ID de curso no encontrado</p>';
            return;
        }

        await configReady;

        // Verificar autenticación y membresía
        const token = localStorage.getItem('authToken');
        if (!token) {
            window.location.href = `/login?redirect=/curso/${courseId}`;
            return;
        }

        try {
            // Verificar acceso
            const accessRes = await fetch(apiUrl('/api/auth/check-access'), {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const accessData = await accessRes.json();

            if (!accessData.success || !accessData.hasAccess) {
                // Sin membresía: mostrar pantalla de bloqueo
                const lockScreen = document.getElementById('lockScreen');
                lockScreen.classList.remove('hidden');
                // Cargar el curso de fondo pero sin mostrar contenido
                const courseRes = await fetch(apiUrl(`/api/courses/${courseId}`));
                const courseData = await courseRes.json();
                const courseName = courseData.success ? encodeURIComponent(courseData.course.name) : '';
                document.getElementById('lockMembershipBtn').href = `/membresia?from=${courseId}&course=${courseName}`;
                document.getElementById('loadingState').style.display = 'none';
                return;
            }

            // Actualizar user en localStorage con datos frescos
            if (accessData.hasMembership !== undefined) {
                const user = JSON.parse(localStorage.getItem('authUser') || '{}');
                user.hasMembership = accessData.hasMembership;
                user.membershipPlan = accessData.membershipPlan;
                localStorage.setItem('authUser', JSON.stringify(user));
            }

            // Cargar el curso
            const res = await fetch(apiUrl(`/api/courses/${courseId}`));
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.message);

            course = data.course;
            document.getElementById('lockScreen').classList.add('hidden');
            initCourse();
        } catch (err) {
            document.getElementById('loadingState').innerHTML = `<p style="color:#f87171;">Error al cargar el curso: ${err.message}</p>`;
        }
    });

    // ── Setup course ──────────────────────────────────────────────────────────
    function initCourse() {
        document.title = `${course.name} - IATIBET ZUREON`;
        document.getElementById('courseTitle').textContent = course.name;
        document.getElementById('episodeCount').textContent = `${course.totalEpisodes || 0} Episodios`;
        document.getElementById('chapterCount').textContent = `${course.totalChapters || 0} Capítulos`;

        // Build flat episode list
        allEpisodes = [];
        (course.chapters || []).forEach((ch, ci) => {
            (ch.episodes || []).forEach((ep, ei) => {
                allEpisodes.push({ chapterIndex: ci, episodeIndex: ei, chapter: ch, episode: ep });
            });
        });

        renderChaptersList();

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('courseContent').style.display = 'block';

        // Auto-play first episode
        if (allEpisodes.length > 0) {
            playEpisode(0);
        }
    }

    // ── Render sidebar ────────────────────────────────────────────────────────
    function renderChaptersList() {
        const container = document.getElementById('chaptersList');
        if (!course.chapters || course.chapters.length === 0) {
            container.innerHTML = '<p style="padding:1.5rem; opacity:0.5; font-size:0.875rem; text-align:center;">Sin contenido aún</p>';
            return;
        }

        let flatIndex = 0;
        const defaultThumb = course.thumbnail || '/uploads/default-course.jpg';
        container.innerHTML = course.chapters.map((ch, ci) => {
            const episodesInfo = ch.episodes || [];
            if (episodesInfo.length === 0) return '';
            
            const episodes = episodesInfo.map((ep, ei) => {
                const idx = flatIndex++;
                const isCompleted = false; // logic goes here when progress is saved.
                return `
                    <div class="episode-item" id="ep-item-${idx}" onclick="playEpisode(${idx})">
                        <div class="episode-thumb" style="background-image: url('${defaultThumb}')">
                            <span class="episode-thumb-overlay">${ep.duration || '0:00'}</span>
                        </div>
                        <div class="episode-info">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                                <span class="episode-title">${ep.title}</span>
                                <div class="episode-check">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                            </div>
                            <div class="episode-duration-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
                                <span>${ep.duration || '0:00'}</span>
                                <span style="margin-left:auto; opacity:0; font-size:0.75rem" class="total-duration">${ep.duration || '0:00'}</span> 
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="chapter-group">
                    <div class="chapter-group-title">
                        <span>Cap. ${ci + 1}: ${ch.title}</span>
                        <span class="ep-count">· ${episodesInfo.length} ep.</span>
                    </div>
                    ${episodes}
                </div>
            `;
        }).join('');
    }

    // ── Play episode ──────────────────────────────────────────────────────────
    function playEpisode(index) {
        if (index < 0 || index >= allEpisodes.length) return;
        currentEpisodeIndex = index;

        const { episode, chapter, chapterIndex, episodeIndex } = allEpisodes[index];

        // Update video
        const container = document.getElementById('videoContainer');
        const videoUrl = episode.videoUrl || '';

        // Convert YouTube watch URL to embed if needed
        const embedUrl = toEmbedUrl(videoUrl);

        if (embedUrl) {
            container.innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
        } else {
            container.innerHTML = `
                <div class="video-placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>URL de video no válida</span>
                    <small style="opacity:0.5;">${videoUrl}</small>
                </div>`;
        }

        // Update now playing
        document.getElementById('nowPlaying').textContent = `▶ ${chapter.title} · ${episode.title}`;

        // Update active state in sidebar
        document.querySelectorAll('.episode-item').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById(`ep-item-${index}`);
        if (activeEl) {
            activeEl.classList.add('active');
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function toEmbedUrl(url) {
        if (!url) return null;
        // Already embed
        if (url.includes('youtube.com/embed/') || url.includes('player.vimeo.com')) return url;
        // YouTube watch
        const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}`;
        // Direct video URL
        if (url.match(/\.(mp4|webm|ogg)$/i)) return url;
        return url; // try as-is
    }

    function prevEpisode() { playEpisode(currentEpisodeIndex - 1); }
    function nextEpisode() { playEpisode(currentEpisodeIndex + 1); }
    </script>
</body>
</html>
