<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Contenido - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --purple: #7C3AED;
            --purple-glow: rgba(124, 58, 237, 0.4);
            --green: #4FFFB0;
            --green-glow: rgba(79, 255, 176, 0.3);
            --bg: #05050A;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --text-main: #f8fafc;
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 100% 0%, rgba(124, 58, 237, 0.08) 0%, transparent 40%);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        /* ── Header ── */
        .topbar {
            background: rgba(5, 5, 10, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 100;
        }
        .topbar-left { display: flex; align-items: center; gap: 1.5rem; }
        .back-btn {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.6rem 1.2rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.1); transform: translateX(-4px); }
        .topbar-title { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em; }
        .course-badge {
            padding: 0.3rem 1rem;
            background: rgba(124, 58, 237, 0.15);
            color: #A78BFA;
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* ── Layout ── */
        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 64px);
        }

        /* ── Sidebar ── */
        .sidebar {
            background: rgba(10, 10, 20, 0.4);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-header h2 { font-size: 0.75rem; font-weight: 800; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 2px; }
        .chapter-count { font-size: 0.8rem; color: var(--purple); font-weight: 800; }
        .sidebar-body { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
        .sidebar-footer { padding: 1.5rem; border-top: 1px solid var(--glass-border); }

        /* ── Chapter List ── */
        .chapter-nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            position: relative;
        }
        .chapter-nav-item:hover { background: rgba(255,255,255,0.02); }
        .chapter-nav-item.active { background: rgba(124, 58, 237, 0.08); border-left-color: var(--purple); }
        .chapter-nav-num {
            width: 28px; height: 28px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 800; color: rgba(255,255,255,0.4);
            flex-shrink: 0;
        }
        .chapter-nav-item.active .chapter-nav-num { background: var(--purple); border-color: transparent; color: white; }
        .chapter-nav-title { font-size: 0.9rem; font-weight: 700; color: rgba(255,255,255,0.8); margin-bottom: 0.2rem; }
        .chapter-nav-item.active .chapter-nav-title { color: #fff; }
        .chapter-nav-eps { font-size: 0.7rem; color: rgba(255,255,255,0.3); font-weight: 600; text-transform: uppercase; }

        /* ── Main Content ── */
        .main { overflow-y: auto; padding: 2.5rem; }
        
        /* ── Chapter Detail ── */
        .chapter-detail { max-width: 900px; margin: 0 auto; }
        .chapter-detail-header {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 2rem;
        }
        .chapter-detail-title { font-size: 2rem; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 1rem; }
        .chapter-detail-desc { font-size: 1rem; color: rgba(255,255,255,0.5); line-height: 1.7; }

        /* ── Episodes ── */
        .episode-row {
            display: flex; align-items: center; gap: 1.5rem;
            padding: 1rem 1.5rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin-bottom: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .episode-row:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); transform: translateY(-3px) scale(1.01); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        
        .episode-thumb-preview {
            width: 110px; height: 62px;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .episode-thumb-preview img { width: 100%; height: 100%; object-fit: cover; }
        .episode-thumb-preview i { font-size: 1.2rem; opacity: 0.3; }

        .episode-title { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; letter-spacing: -0.01em; }
        .episode-meta { display: flex; align-items: center; gap: 1.25rem; }
        .episode-url { font-size: 0.8rem; color: rgba(255,255,255,0.4); font-family: inherit; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 350px; }
        .episode-duration { font-size: 0.75rem; font-weight: 800; color: var(--purple); background: rgba(124, 58, 237, 0.15); padding: 0.35rem 0.75rem; border-radius: 100px; border: 1px solid rgba(124, 58, 237, 0.2); }

        /* ── Add Episode Form ── */
        .add-episode-section {
            padding: 3rem;
            background: rgba(255,255,255,0.02);
            border: 2px dashed var(--glass-border);
            border-radius: 28px;
            margin-top: 3rem;
        }
        .add-episode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 120px auto;
            gap: 1.5rem;
            align-items: end;
        }

        /* ── Inputs ── */
        .field label { font-size: 0.7rem; font-weight: 900; color: rgba(255,255,255,0.4); margin-bottom: 0.75rem; display: block; text-transform: uppercase; letter-spacing: 0.1em; }
        .field input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .field input:focus { outline: none; border-color: var(--purple); background: rgba(255,255,255,0.07); box-shadow: 0 0 0 4px var(--purple-glow); }

        /* ── Buttons ── */
        .btn {
            font-family: inherit;
            font-weight: 800;
            border-radius: 14px;
            padding: 1rem 2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 0.95rem;
            border: 1px solid transparent;
        }
        .btn-primary { background: var(--purple); color: white; box-shadow: 0 8px 30px var(--purple-glow); border: none; }
        .btn-primary:hover { background: #6D28D9; transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 40px rgba(124, 58, 237, 0.5); }
        .btn-secondary { background: var(--glass); color: #fff; border: 1px solid var(--glass-border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); border-color: #EF4444; transform: translateY(-2px); }
        .btn-success { background: var(--purple); color: white; border: none; } /* Match primary */
        
        .btn-icon-sm {
            width: 42px; height: 42px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            cursor: pointer; transition: all 0.2s;
            color: rgba(255,255,255,0.5);
        }
        .btn-icon-sm:hover { background: rgba(255,255,255,0.1); color: #fff; transform: translateY(-2px) scale(1.05); }
        .btn-icon-sm.delete:hover { background: rgba(239, 68, 68, 0.15); color: #EF4444; border-color: rgba(239, 68, 68, 0.3); }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            padding: 1rem 1.5rem;
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex; align-items: center; gap: 0.75rem;
            transform: translateY(20px); opacity: 0; pointer-events: none;
            transition: all 0.3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
        
        @media (max-width: 1024px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .add-episode-grid { grid-template-columns: 1fr; }
        }

        /* ── Loading ── */
        .spinner { width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 1rem; color: var(--gray-500); }

        /* ── Empty state ── */
        .empty-episodes { padding: 2rem; text-align: center; color: var(--gray-500); font-size: 0.875rem; }

        /* ── Drag handle ── */
        .drag-handle { color: var(--gray-300); cursor: grab; flex-shrink: 0; }
        .drag-handle:active { cursor: grabbing; }

        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { height: 250px; }
            .add-episode-grid { grid-template-columns: 1fr; }
            .add-chapter-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- Top Bar -->
<header class="topbar">
    <div class="topbar-left">
        <a href="/admin" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            Volver al Admin
        </a>
        <div>
            <div class="topbar-title">Gestionar Contenido</div>
        </div>
        <span class="course-badge" id="courseBadge">Cargando...</span>
    </div>
    <div class="save-indicator" id="saveIndicator">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        Guardado
    </div>
</header>

<!-- Layout -->
<div class="layout">

    <!-- Sidebar: Chapter List -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Capítulos</h2>
            <span class="chapter-count" id="chapterCount">0 capítulos</span>
        </div>
        <div class="sidebar-body" id="chapterNav">
            <div class="loading-overlay">
                <div class="spinner"></div>
                <span>Cargando...</span>
            </div>
        </div>
        <div class="sidebar-footer">
            <button class="btn btn-primary" style="width:100%;" onclick="showAddChapterForm()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                Nuevo Capítulo
            </button>
        </div>
    </aside>

    <!-- Main: Chapter Detail + Episodes -->
    <main class="main" id="mainContent">
        <div class="main-empty" id="emptyState">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            <h3>Selecciona un capítulo</h3>
            <p>Elige un capítulo del panel izquierdo para ver y gestionar sus episodios.</p>
        </div>
        <div id="chapterDetail" style="display:none;" class="chapter-detail"></div>
    </main>
</div>

<!-- Add Chapter Form (floating panel) -->
<div id="addChapterPanel" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:500; display:none; align-items:center; justify-content:center; padding:2rem;">
    <div style="background:white; border-radius:16px; padding:2rem; max-width:500px; width:100%; box-shadow:0 25px 50px rgba(0,0,0,0.25);">
        <h3 style="font-size:1.25rem; font-weight:700; margin-bottom:1.5rem;">Nuevo Capítulo</h3>
        <div class="field" style="margin-bottom:1rem;">
            <label>Título del Capítulo *</label>
            <input type="text" id="newChapterTitle" placeholder="Ej: Introducción al tema">
        </div>
        <div class="field" style="margin-bottom:1.5rem;">
            <label>Descripción (opcional)</label>
            <input type="text" id="newChapterDesc" placeholder="Breve descripción del capítulo">
        </div>
        <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
            <button class="btn btn-secondary" onclick="hideAddChapterForm()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveNewChapter()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
                Guardar Capítulo
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/config.js"></script>
<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let courseId = null;
let course = null;
let selectedChapterId = null;

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    const parts = window.location.pathname.split('/');
    courseId = parts[parts.length - 1];

    if (!courseId || courseId === 'content') {
        showToast('ID de serie no encontrado en la URL', 'error');
        return;
    }

    await configReady; // esperar que se cargue la URL del backend
    loadCourse();
});

// ─────────────────────────────────────────────
// Load Course
// ─────────────────────────────────────────────
async function loadCourse() {
    try {
        const res = await fetch(apiUrl(`/api/courses/${courseId}`));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.message);

        course = data.course;
        document.getElementById('courseBadge').textContent = course.name;
        document.title = `Contenido: ${course.name}`;
        renderChapterNav();

        // Auto-select first chapter
        if (course.chapters && course.chapters.length > 0) {
            selectChapter(course.chapters[0]._id);
        }
    } catch (err) {
        console.error(err);
        document.getElementById('chapterNav').innerHTML = `<p style="color:#DC2626; padding:1rem; font-size:0.875rem;">Error al cargar: ${err.message}</p>`;
    }
}

// ─────────────────────────────────────────────
// Render Sidebar
// ─────────────────────────────────────────────
function renderChapterNav() {
    const nav = document.getElementById('chapterNav');
    const count = document.getElementById('chapterCount');
    const chapters = course.chapters || [];

    count.textContent = `${chapters.length} capítulo${chapters.length !== 1 ? 's' : ''}`;

    if (chapters.length === 0) {
        nav.innerHTML = `<p style="color:var(--gray-500); font-size:0.875rem; text-align:center; padding:2rem;">Sin capítulos aún.<br>Crea el primero.</p>`;
        return;
    }

    nav.innerHTML = chapters.map((ch, i) => `
        <div class="chapter-nav-item ${ch._id === selectedChapterId ? 'active' : ''}" onclick="selectChapter('${ch._id}')" id="nav-${ch._id}">
            <div class="chapter-nav-num">${i + 1}</div>
            <div class="chapter-nav-info">
                <div class="chapter-nav-title">${ch.title}</div>
                <div class="chapter-nav-eps">${ch.episodes ? ch.episodes.length : 0} episodio${(ch.episodes?.length || 0) !== 1 ? 's' : ''}</div>
            </div>
            <div class="chapter-nav-actions">
                <button class="btn-icon-sm delete" onclick="deleteChapter(event, '${ch._id}')" title="Eliminar">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                </button>
            </div>
        </div>
    `).join('');
}

// ─────────────────────────────────────────────
// Select Chapter
// ─────────────────────────────────────────────
function selectChapter(chapterId) {
    selectedChapterId = chapterId;
    const chapter = course.chapters.find(c => c._id === chapterId);
    if (!chapter) return;

    // Update sidebar active state
    document.querySelectorAll('.chapter-nav-item').forEach(el => el.classList.remove('active'));
    const navItem = document.getElementById(`nav-${chapterId}`);
    if (navItem) navItem.classList.add('active');

    // Render main content
    document.getElementById('emptyState').style.display = 'none';
    const detail = document.getElementById('chapterDetail');
    detail.style.display = 'block';

    const chapterIndex = course.chapters.findIndex(c => c._id === chapterId);

    detail.innerHTML = `
        <!-- Chapter Header -->
        <div class="chapter-detail-header">
            <div style="flex:1;">
                <div style="font-size:0.75rem; font-weight:600; color:var(--purple); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.5rem;">Capítulo ${chapterIndex + 1}</div>
                <div class="chapter-detail-title" id="chTitle-${chapterId}">${chapter.title}</div>
                ${chapter.description ? `<div class="chapter-detail-desc" id="chDesc-${chapterId}">${chapter.description}</div>` : `<div class="chapter-detail-desc" id="chDesc-${chapterId}" style="color:var(--gray-300);">Sin descripción</div>`}
                <div class="chapter-detail-meta">
                    <span class="meta-pill">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        ${chapter.episodes ? chapter.episodes.length : 0} episodios
                    </span>
                </div>
            </div>
            <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-secondary" onclick="startEditChapter('${chapterId}')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Editar
                </button>
                <button class="btn btn-danger" onclick="deleteChapter(null, '${chapterId}')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                    Eliminar
                </button>
            </div>
        </div>

        <!-- Episodes -->
        <div class="episodes-section">
            <div class="episodes-header">
                <h3>Episodios</h3>
                <span style="font-size:0.8rem; color:var(--gray-500);">${chapter.episodes ? chapter.episodes.length : 0} en total</span>
            </div>

            <div id="episodesList-${chapterId}">
                ${renderEpisodesList(chapter)}
            </div>

            <!-- Add Episode Form -->
            <div class="add-episode-section">
                <h4>+ Agregar Episodio</h4>
                <div class="add-episode-grid">
                    <div class="field">
                        <label>Título del Episodio *</label>
                        <input type="text" id="epTitle-${chapterId}" placeholder="Ej: Introducción">
                    </div>
                    <div class="field">
                        <label>URL del Video *</label>
                        <input type="text" id="epUrl-${chapterId}" placeholder="YouTube, Vimeo, etc.">
                    </div>
                    <div class="field">
                        <label>Imagen / Miniatura URL</label>
                        <input type="text" id="epThumb-${chapterId}" placeholder="https://...">
                    </div>
                    <div class="field" style="width: 100px;">
                        <label>Duración</label>
                        <input type="text" id="epDur-${chapterId}" placeholder="12:45">
                    </div>
                    <button class="btn btn-success" onclick="addEpisode('${chapterId}')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                        Agregar
                    </button>
                </div>
            </div>
        </div>
    `;
}

function renderEpisodesList(chapter) {
    if (!chapter.episodes || chapter.episodes.length === 0) {
        return `<div class="empty-episodes" style="padding: 3rem; text-align: center; color: var(--text-muted); background: rgba(0,0,0,0.2); border-radius: 12px; margin: 1rem;">No hay episodios aún.</div>`;
    }
    return chapter.episodes.map((ep, i) => `
        <div class="episode-row" id="ep-row-${ep._id}">
            <div class="drag-handle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="opacity:0.3;"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>
            </div>
            <div class="episode-thumb-preview">
                ${ep.thumbnail ? `<img src="${ep.thumbnail}" alt="">` : `<i>🎬</i>`}
            </div>
            <div class="episode-info">
                <div class="episode-title">${ep.title}</div>
                <div class="episode-meta">
                    <span class="episode-url">${ep.videoUrl}</span>
                    ${ep.duration ? `<span class="episode-duration">${ep.duration}</span>` : ''}
                </div>
            </div>
            <div class="episode-actions">
                <button class="btn-icon-sm" onclick="startEditEpisode('${chapter._id}', '${ep._id}')" title="Editar">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="btn-icon-sm delete" onclick="deleteEpisode('${chapter._id}', '${ep._id}')" title="Eliminar">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                </button>
            </div>
        </div>
    `).join('');
}

// ─────────────────────────────────────────────
// Edit Chapter (inline)
// ─────────────────────────────────────────────
function startEditChapter(chapterId) {
    const chapter = course.chapters.find(c => c._id === chapterId);
    if (!chapter) return;

    const titleEl = document.getElementById(`chTitle-${chapterId}`);
    const descEl = document.getElementById(`chDesc-${chapterId}`);
    if (!titleEl) return;

    const currentTitle = titleEl.textContent;
    const currentDesc = descEl ? descEl.textContent : '';

    titleEl.outerHTML = `<input id="editChTitle-${chapterId}" value="${currentTitle}" style="font-size:1.5rem; font-weight:800; border:2px solid var(--purple); border-radius:8px; padding:0.25rem 0.5rem; width:100%; font-family:inherit;">`;
    if (descEl) descEl.outerHTML = `<input id="editChDesc-${chapterId}" value="${currentDesc === 'Sin descripción' ? '' : currentDesc}" placeholder="Descripción..." style="font-size:0.9rem; border:1px solid var(--gray-300); border-radius:8px; padding:0.25rem 0.5rem; width:100%; font-family:inherit; margin-top:0.5rem;">`;

    // Replace edit button with save/cancel
    const btnArea = document.querySelector(`#chapterDetail .chapter-detail-header div:last-child`);
    if (btnArea) {
        btnArea.innerHTML = `
            <button class="btn btn-secondary" onclick="cancelEditChapter('${chapterId}')">Cancelar</button>
            <button class="btn btn-primary" onclick="saveEditChapter('${chapterId}')">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
                Guardar
            </button>
        `;
    }
}

function cancelEditChapter(chapterId) {
    selectChapter(chapterId); // Re-render
}

async function saveEditChapter(chapterId) {
    const titleInput = document.getElementById(`editChTitle-${chapterId}`);
    const descInput = document.getElementById(`editChDesc-${chapterId}`);
    const newTitle = titleInput ? titleInput.value.trim() : '';
    const newDesc = descInput ? descInput.value.trim() : '';

    if (!newTitle) { showToast('El título es obligatorio', 'error'); return; }

    try {
        const res = await fetch(apiUrl(`/api/courses/${courseId}/chapters/${chapterId}`), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: newTitle, description: newDesc })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showSaved();
        await loadCourse();
        selectChapter(chapterId);
    } catch(err) {
        showToast('Error al guardar: ' + err.message, 'error');
    }
}

// ─────────────────────────────────────────────
// Edit Episode (inline)
// ─────────────────────────────────────────────
function startEditEpisode(chapterId, episodeId) {
    const chapter = course.chapters.find(c => c._id === chapterId);
    const episode = chapter?.episodes.find(e => e._id === episodeId);
    if (!episode) return;

    const row = document.getElementById(`ep-row-${episodeId}`);
    if (!row) return;

    // Replace row with edit row
    row.outerHTML = `
        <div class="inline-edit-row" id="ep-row-${episodeId}" style="display: grid; grid-template-columns: 2fr 2fr 2fr 1fr auto; gap: 0.75rem; align-items: center; background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 12px; margin-bottom: 0.75rem; border: 1px solid var(--purple);">
            <div class="field"><input id="editEpTitle-${episodeId}" value="${episode.title}" placeholder="Título"></div>
            <div class="field"><input id="editEpUrl-${episodeId}" value="${episode.videoUrl}" placeholder="URL video"></div>
            <div class="field"><input id="editEpThumb-${episodeId}" value="${episode.thumbnail || ''}" placeholder="URL Imagen"></div>
            <div class="field"><input id="editEpDur-${episodeId}" value="${episode.duration || ''}" placeholder="Dura." style="width:100%;"></div>
            <div style="display:flex; gap:0.4rem;">
                <button class="btn btn-secondary" style="padding:0.6rem;" onclick="selectChapter('${chapterId}')">✕</button>
                <button class="btn btn-primary" style="padding:0.6rem;" onclick="saveEditEpisode('${chapterId}', '${episodeId}')">✓</button>
            </div>
        </div>
    `;
    document.getElementById(`editEpTitle-${episodeId}`)?.focus();
}

async function saveEditEpisode(chapterId, episodeId) {
    const title = document.getElementById(`editEpTitle-${episodeId}`)?.value.trim();
    const videoUrl = document.getElementById(`editEpUrl-${episodeId}`)?.value.trim();
    const duration = document.getElementById(`editEpDur-${episodeId}`)?.value.trim();
    const thumbnail = document.getElementById(`editEpThumb-${episodeId}`)?.value.trim();

    if (!title || !videoUrl) { showToast('Título y URL son obligatorios', 'error'); return; }

    try {
        const res = await fetch(apiUrl(`/api/courses/${courseId}/chapters/${chapterId}/episodes/${episodeId}`), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, videoUrl, duration, thumbnail })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showSaved();
        await loadCourse();
        selectChapter(chapterId);
    } catch(err) {
        showToast('Error al guardar: ' + err.message, 'error');
    }
}

// ─────────────────────────────────────────────
// Add Chapter
// ─────────────────────────────────────────────
function showAddChapterForm() {
    const panel = document.getElementById('addChapterPanel');
    panel.style.display = 'flex';
    document.getElementById('newChapterTitle').value = '';
    document.getElementById('newChapterDesc').value = '';
    document.getElementById('newChapterTitle').focus();
}

function hideAddChapterForm() {
    document.getElementById('addChapterPanel').style.display = 'none';
}

async function saveNewChapter() {
    const title = document.getElementById('newChapterTitle').value.trim();
    const description = document.getElementById('newChapterDesc').value.trim();
    if (!title) { showToast('El título es obligatorio', 'error'); return; }

    try {
        const res = await fetch(apiUrl(`/api/courses/${courseId}/chapters`), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, description })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        hideAddChapterForm();
        showSaved();
        await loadCourse();
        // Select the new chapter
        const newChapterId = data.chapter?._id || course.chapters[course.chapters.length - 1]?._id;
        if (newChapterId) selectChapter(newChapterId);
    } catch(err) {
        showToast('Error: ' + err.message, 'error');
    }
}

// ─────────────────────────────────────────────
// Delete Chapter
// ─────────────────────────────────────────────
async function deleteChapter(e, chapterId) {
    if (e) e.stopPropagation();
    const chapter = course.chapters.find(c => c._id === chapterId);
    if (!confirm(`¿Eliminar el capítulo "${chapter?.title}"? Se eliminarán todos sus episodios.`)) return;

    try {
        const res = await fetch(apiUrl(`/api/courses/${courseId}/chapters/${chapterId}`), { method: 'DELETE' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showSaved();
        if (selectedChapterId === chapterId) {
            selectedChapterId = null;
            document.getElementById('emptyState').style.display = 'flex';
            document.getElementById('chapterDetail').style.display = 'none';
        }
        await loadCourse();
    } catch(err) {
        showToast('Error: ' + err.message, 'error');
    }
}

// ─────────────────────────────────────────────
// Add Episode
// ─────────────────────────────────────────────
async function addEpisode(chapterId) {
    const title = document.getElementById(`epTitle-${chapterId}`)?.value.trim();
    const videoUrl = document.getElementById(`epUrl-${chapterId}`)?.value.trim();
    const duration = document.getElementById(`epDur-${chapterId}`)?.value.trim();
    const thumbnail = document.getElementById(`epThumb-${chapterId}`)?.value.trim();
    if (!title || !videoUrl) { showToast('Título y URL son obligatorios', 'error'); return; }

    try {
        const res = await fetch(apiUrl(`/api/courses/${courseId}/chapters/${chapterId}/episodes`), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, videoUrl, duration, thumbnail })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showSaved();
        await loadCourse();
        selectChapter(chapterId);
    } catch(err) {
        showToast('Error: ' + err.message, 'error');
    }
}

// ─────────────────────────────────────────────
// Delete Episode
// ─────────────────────────────────────────────
async function deleteEpisode(chapterId, episodeId) {
    if (!confirm('¿Eliminar este episodio?')) return;

    try {
        const res = await fetch(apiUrl(`/api/courses/${courseId}/chapters/${chapterId}/episodes/${episodeId}`), { method: 'DELETE' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showSaved();
        await loadCourse();
        selectChapter(chapterId);
    } catch(err) {
        showToast('Error: ' + err.message, 'error');
    }
}

// ─────────────────────────────────────────────
// UI Helpers
// ─────────────────────────────────────────────
function showSaved() {
    const el = document.getElementById('saveIndicator');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
    showToast('Guardado correctamente', 'success');
}

function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
}

// Close add chapter panel on backdrop click
document.getElementById('addChapterPanel').addEventListener('click', (e) => {
    if (e.target === document.getElementById('addChapterPanel')) hideAddChapterForm();
});

// ESC to close panel
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideAddChapterForm();
});
</script>
</body>
</html>
