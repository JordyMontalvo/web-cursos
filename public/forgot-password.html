<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - IATIBET ZUREON</title>
    <meta name="description" content="Recupera la contraseña de tu cuenta">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function () {
            const name = localStorage.getItem('branding_companyName');
            const logo = localStorage.getItem('branding_logoUrl');
            if (name || logo) {
                const style = document.createElement('style');
                style.id = 'early-branding-style';
                let css = '';
                if (name) {
                    css += `.logo-text, .logo-text-sm, .auth-logo-text { visibility: hidden; position: relative; } `;
                    css += `.logo-text::after, .logo-text-sm::after, .auth-logo-text::after { content: "${name}"; visibility: visible; position: absolute; left: 0; top: 0; width: 100%; height: 100%; } `;
                }
                if (logo) {
                    css += `.logo-icon, .logo-icon-sm, .auth-logo-icon { background-image: url("${logo}") !important; background-size: cover !important; background-position: center !important; border: none !important; color: transparent !important; }`;
                }
                style.innerHTML = css;
                document.head.appendChild(style);
            }
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0A0A0F;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .auth-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .auth-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(124, 58, 237, 0.15) 0%, transparent 50%);
            animation: rotateBG 20s linear infinite;
        }

        @keyframes rotateBG {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .auth-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #7C3AED, #EC4899);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.25rem;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .auth-title {
            color: #fff;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .auth-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #7C3AED;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #7C3AED, #EC4899);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }

        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10B981;
        }

        .alert.hidden {
            display: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .auth-footer a {
            color: #7C3AED;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="auth-bg"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <div class="auth-logo-icon">I</div>
                    <span class="auth-title auth-logo-text" style="font-size: 1.5rem">IATIBET</span>
                </a>
                <h1 class="auth-title">Recuperar Contraseña</h1>
                <p class="auth-subtitle">Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.</p>
            </div>

            <div class="alert hidden" id="forgotAlert">
                <span id="forgotAlertMsg"></span>
            </div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="forgotEmail">Correo electrónico</label>
                    <input type="email" id="forgotEmail" class="form-input" placeholder="tu@email.com" required>
                </div>

                <button type="submit" class="btn-submit" id="forgotBtn">
                    Enviar Instrucciones
                </button>
            </form>

            <div class="auth-footer">
                ¿Recordaste tu contraseña? <a href="/login.html">Volver a iniciar sesión</a>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script>
        function showAlert(msg, type = 'error') {
            const alert = document.getElementById('forgotAlert');
            alert.className = `alert ${type}`;
            document.getElementById('forgotAlertMsg').innerHTML = msg;
        }
        function hideAlert() {
            document.getElementById('forgotAlert').className = 'alert hidden';
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('forgotEmail').value.trim();
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showAlert('Por favor ingresa un correo electrónico válido.');
                return;
            }

            const btn = document.getElementById('forgotBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Enviando...';

            try {
                await configReady;
                const res = await fetch(apiUrl('/api/auth/forgot-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.success) {
                    showAlert('¡Instrucciones enviadas! Revisa tu bandeja de entrada o spam.', 'success');
                    document.getElementById('forgotForm').reset();
                } else {
                    showAlert(data.message || 'Error al enviar instrucciones. Puede que esta cuenta use Google.');
                }
            } catch (err) {
                showAlert('Error de conexión. Intenta de nuevo.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Enviar Instrucciones';
            }
        });
    </script>
</body>

</html>
