<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Acceso Restringido · IATIBET ZUREON</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #070710;
            --surface: rgba(12,12,22,0.92);
            --border:  rgba(255,255,255,0.07);
            --purple:  #7C3AED;
            --red:     #EF4444;
            --green:   #4FFFB0;
            --muted:   rgba(255,255,255,0.45);
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            overflow: hidden;
        }

        /* ── Animated background ──────────────────────────────── */
        .bg-layer {
            position: fixed; inset: 0; z-index: 0; overflow: hidden;
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: drift 12s ease-in-out infinite;
        }
        .bg-orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(124,58,237,0.18), transparent 70%);
            top: -120px; left: -80px;
            animation-delay: 0s;
        }
        .bg-orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(239,68,68,0.1), transparent 70%);
            bottom: -100px; right: -60px;
            animation-delay: -6s;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%       { transform: translate(20px, -25px) scale(1.06); }
        }

        /* ── Grid ─────────────────────────────────────────────── */
        .grid-bg {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(124,58,237,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,58,237,0.035) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* ── Scanline effect ──────────────────────────────────── */
        .scanline {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0,0,0,0.05) 3px,
                rgba(0,0,0,0.05) 4px
            );
        }

        /* ── Layout ───────────────────────────────────────────── */
        .page {
            position: relative; z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            width: 100%; max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(24px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(124,58,237,0.12);
            animation: cardIn 0.5s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Header ───────────────────────────────────────────── */
        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .admin-shield {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(239,68,68,0.15));
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1.25rem;
            position: relative;
            overflow: hidden;
        }
        .admin-shield::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(124,58,237,0.1), transparent);
            animation: shimmer 3s ease infinite;
        }
        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50%       { opacity: 1; }
        }
        .restricted-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #F87171;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.3rem 0.75rem;
            border-radius: 100px;
            margin-bottom: 0.875rem;
        }
        .card-title {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }
        .card-subtitle {
            color: var(--muted);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        /* ── Form ─────────────────────────────────────────────── */
        .form-group { margin-bottom: 1.1rem; }
        .form-label {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.5rem;
        }
        .form-label .dot {
            width: 5px; height: 5px;
            background: var(--purple);
            border-radius: 50%;
        }
        .input-wrap { position: relative; }
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            outline: none;
            letter-spacing: 0.01em;
        }
        .form-input::placeholder { color: rgba(255,255,255,0.2); }
        .form-input:focus {
            border-color: rgba(124,58,237,0.6);
            background: rgba(124,58,237,0.06);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
        }
        .form-input.error {
            border-color: rgba(239,68,68,0.5);
            background: rgba(239,68,68,0.04);
        }
        .toggle-pw {
            position: absolute;
            right: 0.875rem; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            padding: 0.25rem;
            transition: color 0.2s;
            display: flex;
        }
        .toggle-pw:hover { color: rgba(255,255,255,0.7); }

        /* ── Submit ───────────────────────────────────────────── */
        .btn-submit {
            width: 100%;
            padding: 0.95rem 1rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #7C3AED, #5B21B6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }
        .btn-submit::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transition: left 0.5s;
        }
        .btn-submit:hover::before { left: 100%; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(124,58,237,0.45); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .spinner-icon {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Alert ────────────────────────────────────────────── */
        .alert {
            display: none;
            align-items: center;
            gap: 0.6rem;
            padding: 0.875rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            font-weight: 500;
        }
        .alert.show { display: flex; }
        .alert.error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #F87171;
        }
        .alert.success {
            background: rgba(79,255,176,0.08);
            border: 1px solid rgba(79,255,176,0.2);
            color: var(--green);
        }

        /* ── Footer ───────────────────────────────────────────── */
        .card-footer {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.2);
        }
        .card-footer a {
            color: rgba(255,255,255,0.35);
            text-decoration: none;
            transition: color 0.2s;
        }
        .card-footer a:hover { color: rgba(255,255,255,0.7); }

        /* ── Attempt counter ──────────────────────────────────── */
        .attempts-bar {
            margin-top: 0.75rem;
            display: none;
            align-items: center;
            gap: 0.35rem;
        }
        .attempts-bar.show { display: flex; }
        .attempt-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(239,68,68,0.35);
            transition: background 0.3s;
        }
        .attempt-dot.used { background: #EF4444; }
        .attempts-label {
            font-size: 0.75rem;
            color: #F87171;
            margin-left: 0.25rem;
        }
    </style>
</head>
<body>
<div class="bg-layer">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
</div>
<div class="grid-bg"></div>
<div class="scanline"></div>

<div class="page">
    <div class="card">

        <!-- Header -->
        <div class="card-header">
            <div class="admin-shield">🛡️</div>
            <div class="restricted-badge">
                <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><circle cx="4" cy="4" r="4"/></svg>
                ACCESO RESTRINGIDO
            </div>
            <h1 class="card-title">Panel de Administración</h1>
            <p class="card-subtitle">Solo personal autorizado.<br>Cada acceso queda registrado.</p>
        </div>

        <!-- Alert -->
        <div class="alert" id="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="alertMsg"></span>
        </div>

        <!-- Form -->
        <form id="adminLoginForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="adminEmail">
                    <span class="dot"></span> Correo administrativo
                </label>
                <input type="email" id="adminEmail" class="form-input"
                    placeholder="admin@iatibet.com"
                    autocomplete="username"
                    value="admin@iatibet.com"
                    required>
            </div>

            <div class="form-group">
                <label class="form-label" for="adminPassword">
                    <span class="dot"></span> Contraseña
                </label>
                <div class="input-wrap">
                    <input type="password" id="adminPassword" class="form-input"
                        placeholder="••••••••••••"
                        autocomplete="current-password"
                        required>
                    <button type="button" class="toggle-pw" onclick="togglePw()" title="Mostrar contraseña">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Attempts indicator -->
            <div class="attempts-bar" id="attemptsBar">
                <div class="attempt-dot" id="dot1"></div>
                <div class="attempt-dot" id="dot2"></div>
                <div class="attempt-dot" id="dot3"></div>
                <span class="attempts-label" id="attemptsLabel"></span>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Acceder al Panel
            </button>
        </form>

        <!-- Footer -->
        <div class="card-footer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Conexión segura
            <span>·</span>
            <a href="/">← Volver al sitio</a>
        </div>
    </div>
</div>

<script src="/config.js"></script>
<script>
// ── Guard: si ya es admin, ir al panel ─────────────────────────
(function() {
    const token = localStorage.getItem('authToken');
    const user  = JSON.parse(localStorage.getItem('authUser') || 'null');
    if (token && user && user.role === 'admin') {
        window.location.href = '/admin';
    }
})();

// ── Toggle password ────────────────────────────────────────────
function togglePw() {
    const inp = document.getElementById('adminPassword');
    const icon = document.getElementById('eyeIcon');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    icon.innerHTML = show
        ? `<path d="M17.94 17.94C16.23 19.24 14.19 20 12 20C5 20 1 12 1 12C2.24 9.68 4.02 7.72 6.06 6.39M9.9 4.24C10.59 4.09 11.29 4 12 4C19 4 23 12 23 12C22.44 13.12 21.73 14.17 20.89 15.09M1 1L23 23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`
        : `<path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"/><circle cx="12" cy="12" r="3"/>`;
}

// ── Alert ──────────────────────────────────────────────────────
function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.className = `alert ${type} show`;
    document.getElementById('alertMsg').textContent = msg;
}
function hideAlert() {
    document.getElementById('alert').className = 'alert';
}

// ── Attempt counter (bloqueo suave tras 3 intentos) ────────────
let attempts = 0;
let lockUntil = 0;

function updateAttempts() {
    if (attempts === 0) {
        document.getElementById('attemptsBar').classList.remove('show');
        return;
    }
    document.getElementById('attemptsBar').classList.add('show');
    [1,2,3].forEach(i => {
        document.getElementById('dot' + i).classList.toggle('used', i <= attempts);
    });
    const left = 3 - attempts;
    document.getElementById('attemptsLabel').textContent =
        left > 0 ? `${left} intento${left !== 1 ? 's' : ''} restante${left !== 1 ? 's' : ''}` : 'Bloqueado temporalmente';
}

// ── Submit ─────────────────────────────────────────────────────
document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    // Bloqueo temporal
    if (Date.now() < lockUntil) {
        const secs = Math.ceil((lockUntil - Date.now()) / 1000);
        showAlert(`Demasiados intentos. Espera ${secs}s.`);
        return;
    }

    const email    = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;

    if (!email || !password) {
        showAlert('Completa todos los campos.');
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = `<div class="spinner-icon"></div> Verificando...`;

    try {
        await configReady;
        const res  = await fetch(apiUrl('/api/auth/login'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
            // ¿Es admin?
            if (data.user.role !== 'admin') {
                attempts++;
                updateAttempts();
                showAlert('Esta cuenta no tiene permisos de administrador.');
                btn.disabled = false;
                btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Acceder al Panel`;
                if (attempts >= 3) {
                    lockUntil = Date.now() + 30000; // bloqueo 30s
                    btn.disabled = true;
                    setTimeout(() => { btn.disabled = false; lockUntil = 0; }, 30000);
                }
                return;
            }

            // Login admin exitoso
            localStorage.setItem('authToken', data.token);
            localStorage.setItem('authUser', JSON.stringify(data.user));
            showAlert('✓ Acceso concedido. Cargando panel...', 'success');
            attempts = 0;

            btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Acceso concedido`;
            setTimeout(() => { window.location.href = '/admin'; }, 900);

        } else {
            attempts++;
            updateAttempts();
            showAlert(data.message || 'Credenciales incorrectas.');
            btn.disabled = false;
            btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Acceder al Panel`;
            if (attempts >= 3) {
                lockUntil = Date.now() + 30000;
                btn.disabled = true;
                showAlert('Demasiados intentos. Bloqueado 30 segundos.');
                setTimeout(() => {
                    btn.disabled = false;
                    lockUntil = 0;
                    hideAlert();
                }, 30000);
            }
            document.getElementById('adminEmail').classList.toggle('error', true);
            document.getElementById('adminPassword').classList.toggle('error', true);
            setTimeout(() => {
                document.getElementById('adminEmail').classList.remove('error');
                document.getElementById('adminPassword').classList.remove('error');
            }, 1500);
        }
    } catch (err) {
        showAlert('Error de conexión. Intenta de nuevo.');
        btn.disabled = false;
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Acceder al Panel`;
    }
});

// ── Limpiar error al escribir ──────────────────────────────────
['adminEmail', 'adminPassword'].forEach(id => {
    document.getElementById(id).addEventListener('input', hideAlert);
});
</script>
</body>
</html>
